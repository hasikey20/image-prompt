<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HRIDOY GPT 🐐 | Mobile AI Studio</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Highlight.js + Marked -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-main: #0a0a00;
            --bg-sidebar: #14140a;
            --bg-panel: #1f1f0f;
            --bg-input: #2a2a1a;
            --text-main: #f5f5f0;
            --text-muted: #d4d4ce;
            --text-inverse: #0a0a00;
            --accent-color: #F59E0B;
            --accent-hover: #D97706;
            --accent-gradient: linear-gradient(135deg, #F59E0B, #D97706);
            --border-color: rgba(245, 158, 11, 0.2);
            --border-strong: rgba(245, 158, 11, 0.4);
            --success: #10B981;
            --error: #EF4444;
            --info: #3B82F6;
            --warning: #F59E0B;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-code: 'Fira Code', monospace;
            --sidebar-width: 280px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .light-theme {
            --bg-main: #fffbeb;
            --bg-sidebar: #fef3c7;
            --bg-panel: #fde68a;
            --bg-input: #ffffff;
            --text-main: #451a03;
            --text-muted: #78350f;
            --text-inverse: #ffffff;
            --border-color: rgba(217, 119, 6, 0.2);
            --border-strong: rgba(217, 119, 6, 0.4);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            transition: background-color var(--transition), color var(--transition);
        }

        /* Mobile-first scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
        .hidden { display: none !important; }

        /* LOGIN (touch friendly) */
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: var(--bg-main); display: flex;
            align-items: center; justify-content: center; padding: 1.5rem;
        }
        .login-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            border-radius: var(--radius-lg);
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
        }
        .login-logo { font-size: 4.5rem; margin-bottom: 0.75rem; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            width: 100%; padding: 14px 12px; margin-top: 1rem;
            border-radius: 60px;
            font-weight: 600; font-size: 1rem;
            transition: transform 0.15s, filter 0.2s;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent-gradient); color: var(--text-inverse); border: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-main); }

        /* SIDEBAR (mobile drawer) */
        #sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            transition: left 0.25s ease-out;
            box-shadow: 5px 0 25px rgba(0,0,0,0.4);
        }
        #sidebar.open { left: 0; }
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 1050;
            display: none;
        }
        .sidebar-overlay.open { display: block; }

        .sidebar-header { padding: 1.5rem 1.2rem; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; }
        .sidebar-btn {
            margin: 0.5rem 1rem; padding: 12px 16px;
            background: var(--bg-panel); color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            display: flex; gap: 12px; align-items: center;
            font-weight: 600;
            transition: all 0.2s;
        }
        .sidebar-btn:active { background: var(--accent-color); color: #000; }
        .search-bar {
            margin: 0.8rem 1rem; padding: 12px 16px;
            border-radius: 60px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: calc(100% - 2rem);
            font-size: 0.95rem;
        }
        .history-list { flex: 1; overflow-y: auto; padding: 0 0.8rem; }
        .history-group-title { font-size: 0.7rem; letter-spacing: 1px; color: var(--text-muted); margin: 1rem 0 0.4rem 0.5rem; }
        .history-item {
            padding: 12px 12px;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .history-item:active { background: var(--bg-panel); }
        .history-item.active { background: var(--bg-panel); color: var(--accent-color); }
        .delete-chat { color: var(--error); opacity: 0.6; padding: 6px; border-radius: 30px; }
        .delete-chat:active { opacity: 1; background: rgba(239,68,68,0.2); }
        .sidebar-footer { padding: 1rem; border-top: 1px solid var(--border-color); margin-top: auto; }

        /* MAIN AREA */
        main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); width: 100%; }
        .topbar {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 0, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .menu-toggle { background: transparent; font-size: 1.8rem; border: none; color: var(--text-main); padding: 6px 12px; cursor: pointer; }
        .model-badge { background: var(--bg-panel); padding: 6px 14px; border-radius: 40px; font-size: 0.7rem; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
        .topbar-actions { display: flex; gap: 12px; }
        .icon-btn { background: transparent; border: none; font-size: 1.5rem; color: var(--text-main); padding: 6px; cursor: pointer; }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0.8rem 1.5rem;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 70vh;
            padding: 1rem;
        }
        .welcome-goat { font-size: 4rem; margin-bottom: 0.5rem; }
        .suggestions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin-top: 2rem;
        }
        .suggestion-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.1s linear;
            text-align: left;
        }
        .suggestion-card:active { transform: scale(0.98); background: var(--accent-color); color: #000; }

        /* MESSAGE BUBBLES */
        .message-wrapper {
            display: flex;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 100%;
            gap: 8px;
        }
        .message-wrapper.user { justify-content: flex-end; }
        .message {
            padding: 12px 18px;
            border-radius: 24px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.45;
        }
        .message.user {
            background: var(--accent-gradient);
            color: var(--text-inverse);
            border-bottom-right-radius: 6px;
        }
        .message.ai {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .avatar.ai { background: var(--accent-gradient); color: #000; }
        .avatar.user { background: var(--bg-panel); border: 1px solid var(--border-color); }

        /* MARKDOWN & CODE */
        .message.ai pre { background: var(--bg-main); padding: 12px; border-radius: 16px; overflow-x: auto; margin: 12px 0; position: relative; }
        .copy-code-btn {
            position: absolute; top: 6px; right: 6px;
            background: var(--bg-panel); border: none; padding: 4px 8px;
            border-radius: 30px; font-size: 0.7rem; cursor: pointer;
        }
        .gen-image-container { margin-top: 0.5rem; text-align: center; }
        .gen-image { max-width: 100%; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer; }

        /* INPUT AREA (mobile thumb zone) */
        .input-container {
            padding: 0.8rem 1rem 1.2rem;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
        }
        .input-box {
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            border-radius: 60px;
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 18px;
            gap: 8px;
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            padding: 10px 0;
            outline: none;
        }
        .input-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.94); background: var(--accent-color); }
        .send-btn { background: var(--accent-gradient); color: var(--text-inverse); }
        .char-count { text-align: right; font-size: 0.7rem; margin-top: 5px; margin-right: 8px; color: var(--text-muted); }

        /* MODAL MOBILE */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .modal {
            background: var(--bg-main);
            border-radius: 32px;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-btn { font-size: 2rem; background: none; border: none; color: var(--text-main); padding: 0 8px; }
        .settings-grid { display: flex; flex-direction: column; gap: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-control { width: 100%; padding: 12px; border-radius: 40px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); }
        .security-status { background: var(--bg-panel); border-radius: 24px; padding: 1rem; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-panel); color: var(--text-main);
            padding: 12px 20px; border-radius: 60px;
            z-index: 3000; font-size: 0.85rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent-color);
            max-width: 90vw;
            white-space: nowrap;
            overflow-x: auto;
            pointer-events: none;
        }

        .typing-dots { display: flex; gap: 4px; padding: 6px 0; }
        .typing-dots span { width: 7px; height: 7px; background: var(--text-main); border-radius: 50%; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%,80%,100%{ transform: translateY(0); } 40%{ transform: translateY(-6px); } }
        
        @media (max-width: 480px) {
            .message { max-width: 90%; font-size: 0.9rem; }
            .topbar h3 { max-width: 130px; font-size: 1rem; }
            .action-btn { width: 44px; height: 44px; }
            .suggestion-card { padding: 0.9rem; }
            .model-badge span { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div class="login-logo">🐐</div>
        <h1 class="brand-font gradient-text" style="font-size: 1.8rem;">HRIDOY GPT</h1>
        <p style="margin: 0.5rem 0 1rem;">Secure • Modern • Fast</p>
        <button id="btn-google-login" class="btn btn-primary">🔐 Sign in with Google</button>
        <button id="btn-guest-login" class="btn btn-outline">👤 Continue as Guest</button>
    </div>
</div>

<div id="app-screen" class="app-container hidden">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="sidebar-header"><span style="font-size: 2rem;">🐐</span><span class="gradient-text">HRIDOY GPT</span></div>
        <button id="btn-new-chat" class="sidebar-btn" style="background: var(--accent-gradient); color:#000;">✨ New Chat</button>
        <input type="text" id="search-chats" class="search-bar" placeholder="Search chats...">
        <div id="history-container" class="history-list"></div>
        <div class="sidebar-footer">
            <button id="btn-clear-chats" class="sidebar-btn" style="color: var(--error);">🗑️ Clear All</button>
            <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=Guest&background=F59E0B&color=000" style="width: 40px; height: 40px; border-radius: 50%;">
                <div><div id="user-name" style="font-weight: 700;">Guest</div><div id="user-role" style="font-size: 0.7rem;">Local</div></div>
            </div>
        </div>
    </aside>

    <main>
        <div class="topbar">
            <div class="topbar-left"><button id="btn-menu" class="menu-toggle">☰</button><h3 id="current-chat-title" class="brand-font">New Chat</h3></div>
            <div class="topbar-actions"><div class="model-badge"><div class="status-dot"></div><span id="badge-model-name">GPT-4o</span></div>
            <button id="btn-theme-toggle" class="icon-btn">🌓</button><button id="btn-settings" class="icon-btn">⚙️</button><button id="btn-logout" class="icon-btn">🚪</button></div>
        </div>
        <div id="chat-container" class="chat-container"><div id="welcome-screen" class="welcome-screen"><div class="welcome-goat">🐐</div><h1 class="gradient-text">Hey, what's on your mind?</h1><div class="suggestions-grid"><div class="suggestion-card" data-suggestion="Explain quantum computing like I'm 5">⚛️ Quantum Computing</div><div class="suggestion-card" data-suggestion="Write a Python function to merge two dictionaries">🐍 Python Code</div><div class="suggestion-card" data-suggestion="Give me 5 creative low-budget business ideas">💡 Business ideas</div><div class="suggestion-card" data-suggestion="Write a professional apology email to a client">📧 Email template</div></div></div></div>
        <div class="input-container"><div class="input-box"><textarea id="chat-input" rows="1" placeholder="Message HRIDOY GPT..." maxlength="8000"></textarea><div class="input-actions"><button id="btn-img-mode" class="action-btn" title="Image Gen">🎨</button><button id="btn-stop" class="action-btn hidden">⏹️</button><button id="btn-send" class="action-btn send-btn">➤</button></div></div><div class="char-count"><span id="char-current">0</span>/8000</div></div>
    </main>
</div>

<div id="settings-modal" class="modal-overlay hidden"><div class="modal"><div class="modal-header"><h2>⚙️ Settings</h2><button class="close-btn" onclick="document.getElementById('settings-modal').classList.add('hidden')">×</button></div><div class="settings-grid"><div><div class="form-group"><label>OpenRouter API Key</label><input type="password" id="setting-api-key" class="form-control" placeholder="sk-or-v1-..."></div><div class="form-group"><label>Model ID</label><input id="setting-model-id" class="form-control" value="openai/gpt-4o-mini"></div><div class="form-group"><label>System Prompt</label><textarea id="setting-system-prompt" rows="2" class="form-control">You are HRIDOY GPT, helpful assistant.</textarea></div></div><div><div class="form-group"><label>Image Provider</label><select id="setting-img-provider" class="form-control"><option value="pollinations">Pollinations (Free)</option><option value="openrouter">OpenRouter</option></select></div><div id="group-img-model" style="display:none;"><div class="form-group"><label>Image Model</label><input id="setting-img-model" class="form-control" placeholder="stabilityai/sdxl"></div></div><div class="security-status"><div>✅ Cloud Sync Active</div><div>✅ Encrypted Storage</div></div><button id="btn-save-settings" class="btn btn-primary" style="margin-top: 1rem;">Save Settings</button><p id="non-admin-warning" style="color:var(--error); font-size:0.75rem; margin-top:6px; display:none;">Read-only: admin required.</p></div></div></div></div>
<div id="fullscreen-img-modal" class="modal-overlay hidden" onclick="this.classList.add('hidden')"><img id="fullscreen-img" style="max-width:90vw; max-height:90vh; border-radius:24px;"></div>

<script type="module">
    // FIREBASE & GLOBALS
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    const firebaseConfig = { apiKey: "AIzaSyCuo4DlvFQPMecg-iSJus8KV3bBaV70Z8Y", authDomain: "hridoy-gpt.firebaseapp.com", databaseURL: "https://hridoy-gpt-default-rtdb.firebaseio.com", projectId: "hridoy-gpt", storageBucket: "hridoy-gpt.firebasestorage.app", appId: "1:831871666804:web:bffed9adb2f66b5d1adf21" };
    let app, auth, db, googleProvider;
    try { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getDatabase(app); googleProvider = new GoogleAuthProvider(); } catch(e) { console.warn("Firebase local fallback"); }
    
    const ADMIN_EMAILS = ["khanshahidkhanshahid96@gmail.com", "lifelinehelp10@gmail.com"];
    let STATE = { user: null, isAdmin: false, conversations: JSON.parse(localStorage.getItem('hridoy_gpt_conversations') || '[]'), currentChatId: null, isGenerating: false, abortController: null, isImageMode: false, settings: { openRouterKey: "", modelId: "openai/gpt-4o-mini", systemPrompt: "You are HRIDOY GPT, a creative assistant. Use markdown.", imageProvider: "pollinations", imageModel: "stabilityai/stable-diffusion-xl", theme: "dark" } };
    
    // ---- Helper Globals for inline ----
    window.showToast = (msg, type = 'info') => { const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
    window.openFullscreenImg = (url) => { document.getElementById('fullscreen-img').src = url; document.getElementById('fullscreen-img-modal').classList.remove('hidden'); };
    window.fillInput = (txt) => { const inp = document.getElementById('chat-input'); inp.value = txt; inp.focus(); autoResizeTextarea(); };
    window.togglePassword = (id) => { const el = document.getElementById(id); if(el) el.type = el.type === 'password' ? 'text' : 'password'; };
    
    function autoResizeTextarea() { const ta = document.getElementById('chat-input'); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; document.getElementById('char-current').innerText = ta.value.length; }
    function sanitizeInput(s) { return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function saveConversations() { localStorage.setItem('hridoy_gpt_conversations', JSON.stringify(STATE.conversations)); renderSidebarHistory(); }
    function renderSidebarHistory() { const container = document.getElementById('history-container'); const search = document.getElementById('search-chats').value.toLowerCase(); container.innerHTML = ''; let filtered = STATE.conversations.filter(c => c.title.toLowerCase().includes(search)); if(filtered.length===0){ container.innerHTML='<div style="padding:1rem;text-align:center;">No chats</div>'; return; } filtered.forEach(c => { const div = document.createElement('div'); div.className = `history-item ${c.id===STATE.currentChatId ? 'active' : ''}`; div.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${c.title}</span><span class="delete-chat" data-id="${c.id}">🗑️</span>`; div.querySelector('.delete-chat')?.addEventListener('click',(e)=>{ e.stopPropagation(); if(confirm("Delete?")){ STATE.conversations=STATE.conversations.filter(x=>x.id!==c.id); saveConversations(); if(STATE.currentChatId===c.id) createNewChat(); } }); div.addEventListener('click',()=>loadConversation(c.id)); container.appendChild(div); }); }
    function createNewChat() { STATE.currentChatId = null; document.getElementById('current-chat-title').innerText = "New Chat"; document.getElementById('chat-container').innerHTML = document.getElementById('welcome-screen').outerHTML; attachSuggestionEvents(); }
    function loadConversation(id) { const conv = STATE.conversations.find(c=>c.id===id); if(!conv) return; STATE.currentChatId = id; document.getElementById('current-chat-title').innerText = conv.title; const container = document.getElementById('chat-container'); container.innerHTML = ''; conv.messages.forEach(m => { appendMessageToUI(m.role, m.content, false, m.isImage); }); renderSidebarHistory(); container.scrollTop = container.scrollHeight; }
    function appendMessageToUI(role, content, isStream = false, isImage = false) { const chatDiv = document.getElementById('chat-container'); const wrapper = document.createElement('div'); wrapper.className = `message-wrapper ${role}`; const avatar = document.createElement('div'); avatar.className = `avatar ${role}`; avatar.innerText = role === 'user' ? '👤' : '🐐'; const msgDiv = document.createElement('div'); msgDiv.className = `message ${role}`; if(isImage && role==='ai') msgDiv.innerHTML = `<div class="gen-image-container"><img src="${content}" class="gen-image" onclick="openFullscreenImg('${content}')" loading="lazy"><div class="img-actions" style="display:flex; gap:8px; justify-content:center; margin-top:8px;"><a href="${content}" download="hridoy_image.png" class="sidebar-btn" style="padding:4px 12px;">⬇️ Download</a><button onclick="navigator.clipboard.writeText('${content}');window.showToast('URL copied','success')" class="sidebar-btn" style="padding:4px 12px;">🔗 Copy</button></div></div>`; else if(role==='ai') msgDiv.innerHTML = marked.parse(content); else msgDiv.innerText = content; if(role==='user') { wrapper.appendChild(msgDiv); wrapper.appendChild(avatar); } else { wrapper.appendChild(avatar); wrapper.appendChild(msgDiv); msgDiv.querySelectorAll('pre').forEach(pre=>{ if(!pre.querySelector('.copy-code-btn')){ const btn=document.createElement('button'); btn.className='copy-code-btn'; btn.innerText='Copy'; btn.onclick=()=>{ const code=pre.querySelector('code')?.innerText||''; navigator.clipboard.writeText(code); btn.innerText='Copied!'; setTimeout(()=>btn.innerText='Copy',1500); }; pre.appendChild(btn); } }); } chatDiv.appendChild(wrapper); chatDiv.scrollTop = chatDiv.scrollHeight; return msgDiv; }
    function showTypingIndicator() { const cont=document.getElementById('chat-container'); const ind=document.createElement('div'); ind.id='typing-indicator'; ind.className='message-wrapper ai'; ind.innerHTML='<div class="avatar ai">🐐</div><div class="message ai"><div class="typing-dots"><span></span><span></span><span></span></div></div>'; cont.appendChild(ind); cont.scrollTop=cont.scrollHeight; }
    function removeTypingIndicator() { document.getElementById('typing-indicator')?.remove(); }
    
    async function handleSend() { if(STATE.isGenerating) return; const input = document.getElementById('chat-input').value.trim(); if(!input) return; document.getElementById('chat-input').value = ''; autoResizeTextarea(); const safe = sanitizeInput(input); appendMessageToUI('user', safe); let conv; if(!STATE.currentChatId){ STATE.currentChatId = Date.now().toString(); conv = { id: STATE.currentChatId, title: safe.slice(0,35), messages: [], updatedAt: Date.now() }; STATE.conversations.unshift(conv); saveConversations(); document.getElementById('current-chat-title').innerText = conv.title; } else { conv = STATE.conversations.find(c=>c.id===STATE.currentChatId); conv.updatedAt = Date.now(); } conv.messages.push({ role: 'user', content: safe }); saveConversations(); STATE.isGenerating = true; document.getElementById('btn-send').classList.add('hidden'); document.getElementById('btn-stop').classList.remove('hidden'); STATE.abortController = new AbortController(); try { if(STATE.isImageMode) await generateImage(safe, conv); else await generateChatStream(conv); } catch(e){ if(e.name!=='AbortError'){ showToast(`Error: ${e.message}`,'error'); appendMessageToUI('ai',`⚠️ ${e.message}`); } } finally { STATE.isGenerating = false; document.getElementById('btn-send').classList.remove('hidden'); document.getElementById('btn-stop').classList.add('hidden'); } }
    
    async function generateChatStream(conv) { showTypingIndicator(); if(!STATE.settings.openRouterKey) { removeTypingIndicator(); throw new Error("OpenRouter API Key missing"); } const messages = [{ role: "system", content: STATE.settings.systemPrompt }, ...conv.messages.map(m=>({role:m.role, content:m.content}))]; const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", { method: "POST", headers: { "Authorization": `Bearer ${STATE.settings.openRouterKey}`, "Content-Type": "application/json" }, body: JSON.stringify({ model: STATE.settings.modelId, messages, stream: true }), signal: STATE.abortController.signal }); removeTypingIndicator(); if(!resp.ok) throw new Error("API failed"); const reader = resp.body.getReader(); const decoder = new TextDecoder(); let full = ""; const msgDiv = appendMessageToUI('ai', ""); while(true){ const {done, value} = await reader.read(); if(done) break; const chunk = decoder.decode(value); const lines = chunk.split("\n").filter(l=>l.trim().startsWith("data: ")); for(let line of lines){ if(line.includes("[DONE]")) continue; try{ const json = JSON.parse(line.replace("data: ", "")); const delta = json.choices[0].delta?.content || ""; full += delta; msgDiv.innerHTML = marked.parse(full); document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight; }catch(e){}} } conv.messages.push({ role: 'ai', content: full }); saveConversations(); msgDiv.querySelectorAll('pre code').forEach(block=>hljs.highlightElement(block)); }
    
    async function generateImage(prompt, conv) { showTypingIndicator(); let url = ""; if(STATE.settings.imageProvider === "pollinations"){ url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + " high quality")}?width=1024&height=1024`; await new Promise(r=>setTimeout(r,1200)); } else { url = `https://picsum.photos/1024/1024?random=${Date.now()}`; } removeTypingIndicator(); appendMessageToUI('ai', url, false, true); conv.messages.push({ role: 'ai', content: url, isImage: true }); saveConversations(); }
    
    function updateSettingsUI(){ const s=STATE.settings; document.getElementById('setting-api-key').value = STATE.isAdmin ? s.openRouterKey : "********"; document.getElementById('setting-model-id').value = s.modelId; document.getElementById('setting-system-prompt').value = s.systemPrompt; document.getElementById('setting-img-provider').value = s.imageProvider; document.getElementById('setting-img-model').value = s.imageModel; document.getElementById('badge-model-name').innerText = s.modelId.split('/').pop(); const group = document.getElementById('group-img-model'); if(group) group.style.display = s.imageProvider === 'openrouter' ? 'block' : 'none'; if(!STATE.isAdmin){ document.getElementById('setting-api-key').disabled=true; document.getElementById('setting-model-id').disabled=true; document.getElementById('setting-system-prompt').disabled=true; document.getElementById('setting-img-provider').disabled=true; document.getElementById('setting-img-model').disabled=true; document.getElementById('btn-save-settings').style.display='none'; document.getElementById('non-admin-warning').style.display='block'; } else { document.getElementById('setting-api-key').disabled=false; document.getElementById('setting-model-id').disabled=false; document.getElementById('setting-system-prompt').disabled=false; document.getElementById('setting-img-provider').disabled=false; document.getElementById('setting-img-model').disabled=false; document.getElementById('btn-save-settings').style.display='block'; document.getElementById('non-admin-warning').style.display='none'; } }
    function saveSettingsToCloud(){ if(!STATE.isAdmin) return showToast("Admin only","error"); const newSet = { openRouterKey: document.getElementById('setting-api-key').value, modelId: document.getElementById('setting-model-id').value, systemPrompt: document.getElementById('setting-system-prompt').value, imageProvider: document.getElementById('setting-img-provider').value, imageModel: document.getElementById('setting-img-model').value }; STATE.settings = {...STATE.settings, ...newSet}; if(db) set(ref(db,'global_settings'), STATE.settings).then(()=>showToast("Saved","success")); else showToast("Saved locally","success"); updateSettingsUI(); }
    function toggleTheme(theme){ if(theme==='light') document.body.classList.add('light-theme'); else document.body.classList.remove('light-theme'); STATE.settings.theme = theme; localStorage.setItem('hridoy_gpt_theme',theme); }
    function attachSuggestionEvents(){ document.querySelectorAll('.suggestion-card').forEach(card=>{ card.onclick = () => fillInput(card.innerText.replace(/[⚛️💡📧🐍]/g,'').trim()); }); }
    
    function initApp(user){ STATE.user = user; STATE.isAdmin = user.email && ADMIN_EMAILS.includes(user.email); document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden'); document.getElementById('user-name').innerText = user.isAnonymous ? 'Guest' : (user.displayName || 'User'); document.getElementById('user-role').innerText = STATE.isAdmin ? 'Admin' : 'User'; if(user.photoURL) document.getElementById('user-avatar').src = user.photoURL; const savedTheme = localStorage.getItem('hridoy_gpt_theme') || 'dark'; toggleTheme(savedTheme); if(db){ const settingsRef = ref(db,'global_settings'); onValue(settingsRef,(snap)=>{ if(snap.val()){ STATE.settings = {...STATE.settings, ...snap.val()}; updateSettingsUI(); } }); } else { updateSettingsUI(); } renderSidebarHistory(); if(STATE.conversations.length) loadConversation(STATE.conversations[0].id); else createNewChat(); attachSuggestionEvents(); }
    
    // Event Binding
    document.getElementById('btn-google-login').onclick = () => signInWithPopup(auth, googleProvider);
    document.getElementById('btn-guest-login').onclick = () => signInAnonymously(auth);
    document.getElementById('btn-logout').onclick = () => { signOut(auth); location.reload(); };
    document.getElementById('btn-menu').onclick = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); };
    document.getElementById('sidebar-overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); };
    document.getElementById('btn-new-chat').onclick = createNewChat;
    document.getElementById('btn-clear-chats').onclick = () => { if(confirm("Delete all chats?")){ STATE.conversations = []; saveConversations(); createNewChat(); showToast("All chats cleared","success"); } };
    document.getElementById('search-chats').addEventListener('input', renderSidebarHistory);
    document.getElementById('btn-send').onclick = handleSend;
    document.getElementById('btn-stop').onclick = () => STATE.abortController?.abort();
    document.getElementById('chat-input').addEventListener('input', autoResizeTextarea);
    document.getElementById('chat-input').addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } });
    document.getElementById('btn-img-mode').onclick = (e) => { STATE.isImageMode = !STATE.isImageMode; e.target.classList.toggle('active-mode', STATE.isImageMode); document.getElementById('chat-input').placeholder = STATE.isImageMode ? "Describe image..." : "Message HRIDOY GPT..."; showToast(STATE.isImageMode ? "🖼️ Image Mode ON" : "💬 Chat Mode","info"); };
    document.getElementById('btn-theme-toggle').onclick = () => { const newTheme = document.body.classList.contains('light-theme') ? 'dark' : 'light'; toggleTheme(newTheme); };
    document.getElementById('btn-settings').onclick = () => { updateSettingsUI(); document.getElementById('settings-modal').classList.remove('hidden'); };
    document.getElementById('btn-save-settings').onclick = saveSettingsToCloud;
    document.getElementById('setting-img-provider').addEventListener('change', () => { const prov = document.getElementById('setting-img-provider').value; document.getElementById('group-img-model').style.display = prov === 'openrouter' ? 'block' : 'none'; });
    
    if(auth) onAuthStateChanged(auth, (user) => { if(user) initApp(user); });
    else { initApp({ uid: "local", displayName: "Local User", isAnonymous: true, email: null }); }
    autoResizeTextarea();
</script>
</body>
